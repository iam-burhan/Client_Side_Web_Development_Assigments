<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2 - Website Registration Form</title>
</head>
<body>
    <h2>Website Registration Form</h2>
    <form onsubmit="registerUser(event)">
        Username: <input type="text" id="regUser" required><br><br>
        Email: <input type="email" id="regEmail" required><br><br>
        Password: <input type="password" id="regPass" required><br><br>
        <button type="submit">Create Account</button>
    </form>
    <p id="regOutput" style="color: green; font-weight: bold;"></p>

    <script>
        function registerUser(e) {
            e.preventDefault();
            const user = document.getElementById("regUser").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            document.getElementById("regOutput").innerText = 
                `Registration Successful! Welcome, ${user} (${email}).`;
        }
    </script>
</body>
</html>
