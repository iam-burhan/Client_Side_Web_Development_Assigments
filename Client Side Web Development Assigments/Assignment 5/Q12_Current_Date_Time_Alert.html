<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q12 - Current Date & Time in Message Box</title>
</head>
<body>
    <h2>Display Current Date &amp; Time in Message Box</h2>
    <button onclick="showDateTime()">Show Date &amp; Time</button>

    <script>
        function showDateTime() {
            const now = new Date();
            alert("Current Date and Time:
" + now.toString());
        }
    </script>
</body>
</html>
