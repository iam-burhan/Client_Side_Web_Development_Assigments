<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7 - Prime Numbers (1 to 100)</title>
</head>
<body>
    <h2>Prime Numbers Between 1 and 100</h2>
    <p id="primeOutput"></p>

    <script>
        function isPrime(n) {
            if (n < 2) return false;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        let primes = [];
        for (let num = 1; num <= 100; num++) {
            if (isPrime(num)) primes.push(num);
        }
        document.getElementById("primeOutput").innerText = primes.join(", ");
    </script>
</body>
</html>
