<!DOCTYPE html>

<head>

    <title>Q8 - Table with Hyperlinks</title>
</head>
<body>

            <td>CSS Tutorial</td>
            <td>Learn CSS</td>
            <td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS" target="_blank">Visit</a></td>
        </tr>
        <tr>
            <td>JavaScript</td>
            <td>Learn JS</td>
            <td><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank">Visit</a></td>
        </tr>
    </table>
</body>
</html>
