<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q4 - Colspan Grid Layout</title>
</head>
<body>
    <h2>Table Demonstrating Multiple Colspan Combinations</h2>
    <!-- 7-column grid demonstrating colspan="2" and colspan="3" -->
    <table border="1" cellpadding="10" cellspacing="0" width="600">
        <tr>
            <td colspan="2">colspan="2"</td>
            <td colspan="2">colspan="2"</td>
            <td colspan="3">colspan="3"</td>
        </tr>
        <tr>
            <td colspan="2">colspan="2"</td>
            <td colspan="2">colspan="2"</td>
            <td colspan="2">colspan="2"</td>
            <td>1 col</td>
        </tr>
        <tr>
            <td colspan="2">colspan="2"</td>
            <td colspan="2">colspan="2"</td>
            <td colspan="2">colspan="2"</td>
            <td>1 col</td>
        </tr>
        <tr>
            <td colspan="2">colspan="2"</td>
            <td colspan="2">colspan="2"</td>
            <td colspan="2">colspan="2"</td>
            <td>1 col</td>
        </tr>
    </table>
</body>
</html>
