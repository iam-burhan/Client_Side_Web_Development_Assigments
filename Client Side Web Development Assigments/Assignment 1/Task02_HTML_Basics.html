<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 2 - HTML Basics</title>
</head>
<body>
    <!-- Headings from H1 (largest) to H6 (smallest) -->
    <h1>Main Heading (H1)</h1>
    <h2>Subheading (H2)</h2>
    <h3>Section Heading (H3)</h3>
    <h4>Sub-section Heading (H4)</h4>
    <h5>Minor Heading (H5)</h5>
    <h6>Smallest Heading (H6)</h6>

    <!-- Horizontal Rule separates thematic sections -->
    <hr>

    <!-- Paragraph with Line Break (<br>) -->
    <p>
        This is the first paragraph demonstrating basic HTML structure.<br>
        This line appears directly below using a line break tag.
    </p>
</body>
</html>
