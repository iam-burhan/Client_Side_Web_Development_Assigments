<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 5 - Hyperlinks</title>
</head>
<body>
    <h1 id="top">Hyperlinks Demonstration</h1>

    <!-- Internal Link: Navigates to another local HTML file -->
    <p>1. Internal Link: <a href="Task01_First_HTML_Page.html">Go to Task 1 Page</a></p>

    <!-- External Link: Opens external URL in a new tab -->
    <p>2. External Link: <a href="https://developer.mozilla.org" target="_blank" rel="noopener">Visit MDN Web Docs</a></p>

    <!-- Email Link: Opens default email client -->
    <p>3. Email Link: <a href="mailto:admissions@bvuniversity.edu.in">Send Email to University</a></p>

    <!-- Bookmark Link: Jumps to a specific ID on the same page -->
    <p>4. Bookmark Link: <a href="#footer-section">Jump to Bottom Section</a></p>

    <div style="height: 500px;"></div>

    <hr>
    <h2 id="footer-section">Bottom Section (Bookmark Target)</h2>
    <p><a href="#top">Back to Top</a></p>
</body>
</html>
