<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 9 - Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="#" method="post">
        <label for="sname">Full Name:</label><br>
        <input type="text" id="sname" name="sname"><br><br>

        <label for="spass">Password:</label><br>
        <input type="password" id="spass" name="spass"><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        <label>Skills:</label><br>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="js" name="skills" value="JavaScript">
        <label for="js">JavaScript</label><br><br>

        <label for="course">Select Course:</label><br>
        <select id="course" name="course">
            <option value="MCA">MCA</option>
            <option value="MBA">MBA</option>
            <option value="BCA">BCA</option>
        </select><br><br>

        <label for="photo">Upload Photo:</label><br>
        <input type="file" id="photo" name="photo"><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="35"></textarea><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">
    </form>
</body>
</html>
